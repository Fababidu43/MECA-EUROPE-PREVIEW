<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" fill="none">
  <defs>
    <style>
      .line{stroke:#d9dde2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .line2{stroke:#e7eaee;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#cfd5db;stroke-width:1.5;stroke-dasharray:8 8;stroke-linecap:round}
      .accent{fill:#f36a67}
      .soft{stroke:#eceff2;stroke-width:1.2}
      .gridDot{fill:#d8dadd}
    </style>
  </defs>

  <g opacity="0.6" transform="translate(40 82)">
    <circle class="gridDot" cx="0" cy="0" r="1.7"/><circle class="gridDot" cx="16" cy="0" r="1.7"/><circle class="gridDot" cx="32" cy="0" r="1.7"/><circle class="gridDot" cx="48" cy="0" r="1.7"/>
    <circle class="gridDot" cx="0" cy="16" r="1.7"/><circle class="gridDot" cx="16" cy="16" r="1.7"/><circle class="gridDot" cx="32" cy="16" r="1.7"/><circle class="gridDot" cx="48" cy="16" r="1.7"/>
    <circle class="gridDot" cx="0" cy="32" r="1.7"/><circle class="gridDot" cx="16" cy="32" r="1.7"/><circle class="gridDot" cx="32" cy="32" r="1.7"/><circle class="gridDot" cx="48" cy="32" r="1.7"/>
    <circle class="gridDot" cx="0" cy="48" r="1.7"/><circle class="gridDot" cx="16" cy="48" r="1.7"/><circle class="gridDot" cx="32" cy="48" r="1.7"/><circle class="gridDot" cx="48" cy="48" r="1.7"/>
  </g>

  <!-- roughing toolpath: back-and-forth milling pass -->
  <path d="M150 96 H320 V148 H150 V182 H320" class="line"/>
  <circle cx="150" cy="96" r="8" fill="#fff" class="line"/>
  <circle cx="320" cy="148" r="6" fill="#fff" class="line2"/>

  <path d="M320 182 H420" class="line"/>

  <!-- dimension callout -->
  <g opacity="0.75">
    <line x1="420" y1="76" x2="420" y2="204" class="soft"/>
    <line x1="566" y1="76" x2="566" y2="204" class="soft"/>
    <line x1="420" y1="76" x2="566" y2="76" class="dash"/>
    <path d="M420 76 l11 -5 M420 76 l11 5" class="line2"/>
    <path d="M566 76 l-11 -5 M566 76 l-11 5" class="line2"/>
  </g>
  <circle cx="493" cy="76" r="4" class="accent"/>

  <path d="M566 182 H696" class="line"/>

  <!-- centre target: tool at work -->
  <circle cx="776" cy="130" r="60" class="soft" opacity="0.65"/>
  <circle cx="776" cy="130" r="38" class="soft" opacity="0.8"/>
  <line x1="776" y1="20" x2="776" y2="85" class="dash"/>
  <line x1="776" y1="175" x2="776" y2="212" class="dash"/>
  <line x1="726" y1="130" x2="738" y2="130" class="line2" opacity="0.65"/>
  <line x1="814" y1="130" x2="826" y2="130" class="line2" opacity="0.65"/>
  <circle cx="776" cy="130" r="4.5" class="accent"/>

  <path d="M836 130 H960" class="line"/>

  <!-- finishing pass: stepped contour -->
  <path d="M960 130 H1028 L1044 108 H1108 L1124 152 H1188 L1204 130 H1440" class="line"/>
  <circle cx="1086" cy="130" r="6" fill="#fff" class="line2"/>
  <circle cx="1440" cy="130" r="4.5" class="accent"/>

  <g opacity="0.6" transform="translate(1485 82)">
    <circle class="gridDot" cx="0" cy="0" r="1.7"/><circle class="gridDot" cx="16" cy="0" r="1.7"/><circle class="gridDot" cx="32" cy="0" r="1.7"/><circle class="gridDot" cx="48" cy="0" r="1.7"/><circle class="gridDot" cx="64" cy="0" r="1.7"/>
    <circle class="gridDot" cx="0" cy="16" r="1.7"/><circle class="gridDot" cx="16" cy="16" r="1.7"/><circle class="gridDot" cx="32" cy="16" r="1.7"/><circle class="gridDot" cx="48" cy="16" r="1.7"/><circle class="gridDot" cx="64" cy="16" r="1.7"/>
    <circle class="gridDot" cx="0" cy="32" r="1.7"/><circle class="gridDot" cx="16" cy="32" r="1.7"/><circle class="gridDot" cx="32" cy="32" r="1.7"/><circle class="gridDot" cx="48" cy="32" r="1.7"/><circle class="gridDot" cx="64" cy="32" r="1.7"/>
    <circle class="gridDot" cx="0" cy="48" r="1.7"/><circle class="gridDot" cx="16" cy="48" r="1.7"/><circle class="gridDot" cx="32" cy="48" r="1.7"/><circle class="gridDot" cx="48" cy="48" r="1.7"/><circle class="gridDot" cx="64" cy="48" r="1.7"/>
  </g>
</svg>
